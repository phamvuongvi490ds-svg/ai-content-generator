<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AI Content Generator Pro</title>
  <style>
    :root { --bg: #0b1120; --card: #1e293b; --text: #f1f5f9; --accent: #3b82f6; --border: #334155; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow:hidden; }
    .tabs { height: 65px; width: 100%; background: #0f172a; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 10px; flex-shrink: 0; z-index: 100; }
    .tab { padding: 8px 20px; cursor: pointer; border-radius: 8px; font-weight: 700; color: #94a3b8; transition: 0.2s; border-bottom: 3px solid transparent; }
    .tab.active { color: #fff; background: #1e293b; border-bottom-color: var(--accent); }
    .content-area { flex: 1; padding: 20px; overflow-y: auto; background: radial-gradient(circle at top left,#172554 0,#0b1120 40%); }
    .tab-content { display: none; max-width: 1300px; margin: 0 auto; width: 100%; }
    .tab-content.active { display: block; }
    .card { background: rgba(30,41,59,.95); border: 1px solid #334155; border-radius: 16px; padding: 22px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #cbd5e1; }
    input, textarea, select { width: 100%; background: #020617; border: 1px solid #475569; border-radius: 10px; padding: 12px; color: white; font-size: 14px; outline:none; }
    button { background: linear-gradient(135deg,#2563eb,#7c3aed); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 700; }
    .output-box { background: #010409; border: 1px solid var(--accent); padding: 20px; border-radius: 12px; min-height: 400px; color: #e2e8f0; overflow-y: auto; }
    .char-counter { display: inline-block; background: #0ea5e9; color: #fff; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 99px; }
  </style>
</head>
<body>
<div class="tabs">
  <div style="font-size:18px; font-weight:900; color:#fff; margin-right:30px;">AI CONTENT PRO</div>
  <div class="tab active" onclick="showTab(1)">Cấu hình Bot</div>
  <div class="tab" onclick="showTab(2)">Sáng tạo nội dung</div>
  <div class="tab" onclick="showTab(3)">Viết lại</div>
  <div class="tab" onclick="showTab(4)">API Chung</div>
</div>
<div class="content-area">
  <div id="tab1" class="tab-content active"><div class="card"><h3>Cấu hình Bot</h3>...</div></div>
  <div id="tab2" class="tab-content"><div class="card"><h3>Sáng tạo</h3>...</div></div>
  <div id="tab3" class="tab-content"><div class="card"><h3>Viết lại</h3>...</div></div>
  <div id="tab4" class="tab-content"><div class="card"><h3>API Chung</h3>...</div></div>
</div>
<script src="app.js"></script>
</body>
</html>
