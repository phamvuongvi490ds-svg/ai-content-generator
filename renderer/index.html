<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AI Content Generator Pro</title>
  <style>
    :root { --bg: #0b1120; --card: #1e293b; --text: #f1f5f9; --accent: #3b82f6; --border: #334155; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow:hidden; }
    .tabs { height: 65px; background: #0f172a; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 10px; }
    .tab { padding: 8px 20px; cursor: pointer; border-radius: 8px; font-weight: 700; color: #94a3b8; }
    .tab.active { color: #fff; background: #1e293b; }
    .content-area { flex: 1; padding: 20px; overflow-y: auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: rgba(30,41,59,.95); border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    button { background: linear-gradient(135deg,#2563eb,#7c3aed); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    input, textarea, select { width: 100%; background: #020617; border: 1px solid #475569; padding: 10px; color: white; border-radius: 8px; }
    .char-counter { display: inline-block; background: #0ea5e9; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  </style>
</head>
<body>
<div class="tabs">
  <div class="tab active" onclick="showTab(1)">Cấu hình Bot</div>
  <div class="tab" onclick="showTab(2)">Sáng tạo nội dung</div>
  <div class="tab" onclick="showTab(3)">Viết lại</div>
  <div class="tab" onclick="showTab(4)">API Chung</div>
</div>
<div class="content-area">
  <div id="tab1" class="tab-content active"><div class="card"><h3>Cấu hình Bot</h3><div id="botList"></div></div></div>
  <div id="tab2" class="tab-content"><div class="card"><h3>Sáng tạo</h3><textarea id="topic"></textarea><button onclick="generateContent()">Bắt đầu</button></div></div>
  <div id="tab3" class="tab-content"><div class="card"><h3>Viết lại</h3>
    <div class="form-group"><label>Nội dung</label><span class="char-counter" id="counterArticleFetch">0 ký tự</span><textarea id="originalContent" rows="8"></textarea></div>
    <button onclick="rewriteContent()">Bắt đầu viết lại</button>
  </div></div>
  <div id="tab4" class="tab-content"><div class="card">
      <h3>Cấu hình API Chung</h3>
      <select id="apiTypeGeneral" onchange="toggleGeneralApiInputs()">
          <option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="vertex">Vertex</option>
      </select>
      <input type="password" id="apiKeyGeneral" placeholder="API Key">
      <button onclick="saveGeneralApiConfig()">Lưu API</button>
  </div></div>
</div>
<script src="app.js"></script>
</body>
</html>
