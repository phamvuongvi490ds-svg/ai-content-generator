<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AI Content Generator Pro</title>
  <style>
    :root { --bg: #0b1120; --card: #1e293b; --text: #f1f5f9; --accent: #3b82f6; --border: #334155; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); }
    .tabs { display: flex; gap: 10px; padding: 10px; background: #0f172a; }
    .tab { padding: 10px; cursor: pointer; color: #94a3b8; }
    .tab.active { color: #fff; background: #1e293b; }
    .tab-content { display: none; padding: 20px; }
    .tab-content.active { display: block; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; }
    .form-group { margin-bottom: 15px; }
    textarea { width: 100%; background: #020617; color: white; padding: 10px; }
    button { padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
<div class="tabs">
  <div class="tab active" onclick="showTab(1)">Cấu hình Bot</div>
  <div class="tab" onclick="showTab(2)">Sáng tạo</div>
  <div class="tab" onclick="showTab(3)">Viết lại</div>
  <div class="tab" onclick="showTab(4)">API Chung</div>
</div>
<div id="tab1" class="tab-content active"><div class="card"><h3>Cấu hình Bot</h3><div id="botList"></div></div></div>
<div id="tab2" class="tab-content"><div class="card"><h3>Sáng tạo</h3><textarea id="topic"></textarea><button onclick="generateContent()">Bắt đầu</button></div></div>
<div id="tab3" class="tab-content"><div class="card"><h3>Viết lại</h3>
    <textarea id="rewriteRequirements" placeholder="Yêu cầu viết..."></textarea>
    <input type="text" id="rewriteArticleUrl" placeholder="Link bài báo...">
    <button onclick="fetchArticleIntoRewrite()">Lấy nội dung</button>
    <textarea id="originalContent" rows="8"></textarea>
    <button onclick="rewriteContent()">Bắt đầu viết lại</button>
    <div id="outputTab3" style="min-height:200px; border:1px solid #ccc;"></div>
</div></div>
<div id="tab4" class="tab-content"><div class="card">
    <h3>Cấu hình API Chung</h3>
    <select id="apiTypeGeneral" onchange="toggleGeneralApiInputs()">
      <option value="gemini">Gemini</option>
      <option value="vertex">Vertex</option>
      <option value="openai">OpenAI</option>
    </select>
    <input type="password" id="apiKeyGeneral" placeholder="API Key">
    <button onclick="saveGeneralApiConfig()">Lưu API Chung</button>
</div></div>
<script src="app.js"></script>
</body>
</html>
