<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AI Content Generator Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tabs">
  <div style="font-size:18px; font-weight:900; color:#fff; margin-right:30px;">AI CONTENT PRO</div>
  <div class="tab active" onclick="showTab(1)">Cấu hình Bot</div>
  <div class="tab" onclick="showTab(2)">Sáng tạo nội dung</div>
  <div class="tab" onclick="showTab(3)">Viết lại</div>
  <div class="tab" onclick="showTab(4)">Cấu hình API Chung</div>
</div>
<div class="content-area">
  <div id="tab1" class="tab-content active"><div class="card"><h3>Cấu hình Bot</h3><div id="botList"></div></div></div>
  <div id="tab2" class="tab-content"><div class="card"><h3>Sáng tạo</h3><textarea id="topic"></textarea><button id="generateBtn" onclick="generateContent()">Bắt đầu</button></div></div>
  <div id="tab3" class="tab-content"><div class="card"><h3>Viết lại</h3><textarea id="originalContent" rows="8"></textarea><button onclick="rewriteContent()">Bắt đầu viết lại</button></div></div>
  <div id="tab4" class="tab-content"><div class="card">
      <h3>Cấu hình API Chung (Viết lại)</h3>
      <label>Loại API</label><select id="apiTypeGeneral"><option value="gateway">Gateway</option><option value="gemini">Gemini</option></select>
      <input type="password" id="apiKeyGeneral" placeholder="API Key">
      <button id="saveApiBtn">Lưu API Chung</button>
  </div></div>
</div>
<script src="app.js"></script>
</body>
</html>
